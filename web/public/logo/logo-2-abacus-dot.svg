<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- LOGO B · 算盘 · 像素化演绎 -->
  <defs>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDB56A"/>
      <stop offset="100%" stop-color="#F09A1A"/>
    </linearGradient>
  </defs>
  <!-- 3x3 圆点矩阵（像素化算珠） -->
  <!-- 行 1 -->
  <circle cx="14" cy="14" r="5" fill="none" stroke="#1F1611" stroke-width="1.8"/>
  <circle cx="32" cy="14" r="5" fill="none" stroke="#1F1611" stroke-width="1.8"/>
  <circle cx="50" cy="14" r="5" fill="none" stroke="#1F1611" stroke-width="1.8"/>
  <!-- 行 2：中间那颗是琥珀实心（"AI"） -->
  <circle cx="14" cy="32" r="5" fill="none" stroke="#1F1611" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="6.5" fill="url(#g2)" stroke="#1F1611" stroke-width="2"/>
  <circle cx="50" cy="32" r="5" fill="none" stroke="#1F1611" stroke-width="1.8"/>
  <!-- 行 3 -->
  <circle cx="14" cy="50" r="5" fill="none" stroke="#1F1611" stroke-width="1.8"/>
  <circle cx="32" cy="50" r="5" fill="none" stroke="#1F1611" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="5" fill="none" stroke="#1F1611" stroke-width="1.8"/>
  <!-- 数据流动线（暗示连接） -->
  <line x1="14" y1="14" x2="32" y2="14" stroke="#1F1611" stroke-width="1" opacity="0.25"/>
  <line x1="32" y1="14" x2="50" y2="14" stroke="#1F1611" stroke-width="1" opacity="0.25"/>
  <line x1="14" y1="14" x2="14" y2="32" stroke="#1F1611" stroke-width="1" opacity="0.25"/>
  <line x1="50" y1="14" x2="50" y2="32" stroke="#1F1611" stroke-width="1" opacity="0.25"/>
  <line x1="14" y1="32" x2="14" y2="50" stroke="#1F1611" stroke-width="1" opacity="0.25"/>
  <line x1="50" y1="32" x2="50" y2="50" stroke="#1F1611" stroke-width="1" opacity="0.25"/>
  <line x1="14" y1="50" x2="32" y2="50" stroke="#1F1611" stroke-width="1" opacity="0.25"/>
  <line x1="32" y1="50" x2="50" y2="50" stroke="#1F1611" stroke-width="1" opacity="0.25"/>
</svg>