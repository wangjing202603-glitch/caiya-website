<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- LOGO D · 笔尖 + 算珠 -->
  <defs>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDB56A"/>
      <stop offset="50%" stop-color="#F09A1A"/>
      <stop offset="100%" stop-color="#D6820F"/>
    </linearGradient>
  </defs>
  <!-- 笔尖（倾斜 45°）-->
  <g transform="rotate(45 24 24)">
    <path d="M14 14 L34 14 L34 34 L24 44 L14 34 Z"
          fill="#1F1611" stroke="#1F1611" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- 笔尖中缝（白线）-->
    <line x1="24" y1="14" x2="24" y2="44" stroke="#FFF8EE" stroke-width="1.5"/>
    <!-- 笔尖金属高光 -->
    <line x1="18" y1="14" x2="18" y2="34" stroke="#4A3C2E" stroke-width="0.8" opacity="0.6"/>
  </g>
  <!-- 算珠（琥珀色，位于笔尖斜下方）-->
  <circle cx="48" cy="48" r="11" fill="url(#g4)" stroke="#1F1611" stroke-width="2"/>
  <!-- 算珠穿孔 -->
  <circle cx="48" cy="48" r="2.5" fill="#FFF8EE" stroke="#1F1611" stroke-width="1.2"/>
  <!-- 算珠高光 -->
  <circle cx="44" cy="44" r="2" fill="#FFF8EE" opacity="0.7"/>
</svg>